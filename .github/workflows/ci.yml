name: ci

on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "0 1 * * *"   # nightly live-model eval (02:00/03:00 Harare)
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Unit, integration and MCP transport tests (no live LLM)
        run: pytest
      - name: Eval release gate (deterministic planner) — safety 100%, overall ≥ 90%, languages ≥ 85%
        run: python -m evals.runner --write
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report-offline, path: evals/reports }

  live-evals:
    # Spends real tokens: only nightly / on demand, and only when the repository has an API key secret.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Eval gate with Claude
        if: env.ANTHROPIC_API_KEY != ''
        run: python -m evals.runner --llm anthropic --write
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report-anthropic, path: evals/reports }

  image:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/insureassist:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/insureassist:latest
      - name: Trivy scan (fail on fixable criticals)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/insureassist:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
